[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "artha-ai"
version = "1.0.1"
description = "AI-powered personal finance and expense intelligence platform"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi",
    "uvicorn",
    "argon2-cffi",
    "python-dotenv",
    "sqlalchemy",
    "rich",
    "Pillow",
"opencv-python",
    "numpy",
    "pytesseract"
]

[tool.setuptools.packages.find]
where = ["."]