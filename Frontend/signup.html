<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account — Arth</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <script>
      if (sessionStorage.getItem("user_id")) {
        window.location.href = "dashboard.html";
      }
    </script>
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-side">
        <div class="auth-ambient"></div>
        <div class="auth-side-top">
          <a href="index.html" class="nav-logo"
            ><span class="dot"></span>Arth</a
          >
        </div>
        <div class="auth-quote">
          <div class="q-mark">"</div>
          <p>
            Uploading a receipt takes less time than typing the merchant name
            would have.
          </p>
          <div class="q-attr">— A Arth USER, HOSTEL BLOCK C</div>
        </div>
        <div></div>
      </div>

      <div class="auth-main">
        <div class="auth-form-wrap">
          <div class="form-eyebrow">Get started</div>
          <h1>Create your account</h1>
          <p class="form-sub">Free for students. Takes under a minute.</p>

          <div class="form-alert" id="signup-alert"></div>

          <form id="signup-form" novalidate>
            <div class="field" id="field-name">
              <label for="name">Full name</label>
              <input
                type="text"
                id="name"
                placeholder="Aditi Kumar"
                autocomplete="name"
              />
              <div class="field-error"></div>
            </div>

            <div class="field" id="field-password">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                placeholder="At least 6 characters"
                autocomplete="new-password"
              />
              <div class="field-error"></div>
              <div class="field-hint">Use at least 6 characters.</div>
            </div>
            <button
              type="submit"
              class="btn btn-primary btn-block"
              id="signup-submit"
            >
              Create account
            </button>
          </form>

          <p class="form-footnote">
            Already have an account? <a href="login.html">Log in</a>
          </p>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
